services:
  postgres:
    image: postgres:16-alpine
    container_name: conference-rf2
    environment:
      POSTGRES_DB: conference_rf2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - conference_data2:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  conference_data2: